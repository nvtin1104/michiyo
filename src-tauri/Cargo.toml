[package]
name = "michiyo"
version = "0.1.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread", "process", "io-util"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
async-trait = "0.1"
lru = "0.12"
arboard = "3"
enigo = "0.2"
whatlang = "0.16"
base64 = "0.22"
isolang = "2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
ulid = "3.0.0"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
windows = { version = "0.62", features = ["Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Foundation"] }
[dev-dependencies]
wiremock = "0.6"
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
